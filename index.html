<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Map - September 2018</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
        
        /* Map Legend Styling */
        .legend {
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            line-height: 1.5em;
            color: #333;
            font-family: Arial, sans-serif;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 1. Initialize the map (Centered roughly on Malaysia)
        var map = L.map('map').setView([2.5, 103.0], 8);

        // 2. Add the Esri Dark Gray Base Map
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // 3. Function to determine color based on rainfall
        function getColor(d) {
            return d > 80 ? '#08519c' :  // 81 - 100+ mm (Dark Blue)
                   d > 60 ? '#3182bd' :  // 61 - 80 mm
                   d > 40 ? '#6baed6' :  // 41 - 60 mm
                   d > 20 ? '#bdd7e7' :  // 21 - 40 mm
                            '#eff3ff';   // 0 - 20 mm (Light Blue)
        }

        // 4. Add a legend to the map
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = [0, 21, 41, 61, 81],
                labels = ['0 - 20 mm', '21 - 40 mm', '41 - 60 mm', '61 - 80 mm', '81 - 100+ mm'];

            div.innerHTML += '<strong>Rainfall Amount</strong><br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);

        // 5. Load and parse the CSV data
        Papa.parse("data.csv", {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true, // <-- NEW: This prevents crashes from blank rows at the bottom of the CSV
            error: function(err) {
                // <-- NEW: This will alert you if the file gets blocked
                alert("Could not load data.csv. Make sure you are viewing this via your GitHub Pages link, not a local file.");
            },
            complete: function(results) {
                var data = results.data;
                
                // Get all the date column names (ignoring ID, Station Name, Lat, Long)
                var dateColumns = Object.keys(data[0]).slice(4);
                
                var dateLayers = {};

                dateColumns.forEach(function(date) {
                    var layerGroup = L.layerGroup();

                    data.forEach(function(row) {
                        // Ensure Latitude and Longitude exist before plotting
                        if (row.Latitude && row.Longitude) {
                            var rainfall = row[date] || 0; 
                            
                            var marker = L.circleMarker([row.Latitude, row.Longitude], {
                                radius: 8,
                                fillColor: getColor(rainfall),
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.9
                            });

                            marker.bindPopup("<b>" + row['Station Name'] + "</b><br>Date: " + date + "<br>Rainfall: " + rainfall + " mm");
                            layerGroup.addLayer(marker);
                        }
                    });

                    dateLayers[date] = layerGroup;
                });

                // 6. Add Layer Control to toggle between dates
                L.control.layers(dateLayers, null, {collapsed: false}).addTo(map);

                // Load the first date by default
                if (dateColumns.length > 0) {
                    dateLayers[dateColumns[0]].addTo(map);
                }
            }
        });
    </script>
</body>
</html>
