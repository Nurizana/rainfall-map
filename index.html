<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Map - September 2018</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { padding: 0; margin: 0; }
        html, body, #map { height: 100%; width: 100%; }
        
        /* Map Legend Styling */
        .legend {
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            color: #333;
            font-family: Arial, sans-serif;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            min-height: 50px; 
        }
        
        .legend-circle-container {
            width: 60px; 
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 10px;
        }
        
        .legend-circle {
            border-radius: 50%;
            border: 1px solid #000;
        }

        /* Custom styles for the station labels */
        .station-label {
            color: yellow;
            font-weight: bold;
            font-size: 12px;
            background: transparent;
            border: none;            
            box-shadow: none;        
            text-shadow: 1px 1px 2px black; 
        }
        
        /* Hides the little triangle pointer that usually comes with tooltips */
        .leaflet-tooltip-left.station-label::before,
        .leaflet-tooltip-right.station-label::before {
            display: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <script>
        // 1. Define the Base Map Layers
        var darkNight = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
        });

        var blueOcean = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        // Satellite requires a base image layer and an overlay layer for the city labels
        var satImage = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });
        var satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}');
        var satelliteWithLabels = L.layerGroup([satImage, satLabels]);

        // Grouping the maps for the control menu
        var baseMaps = {
            "Dark Night": darkNight,
            "Blue Ocean": blueOcean,
            "Satellite": satelliteWithLabels
        };

        // 2. Initialize the map with 'Dark Night' as the default layer
        var map = L.map('map', {
            center: [2.5, 103.0],
            zoom: 8,
            layers: [darkNight] 
        });

        // Add the Base Map toggle button to the top left
        L.control.layers(baseMaps, null, {position: 'topleft'}).addTo(map);

        // 3. Function to determine color based on rainfall
        function getColor(d) {
            return d > 80 ? '#08519c' :  
                   d > 60 ? '#3182bd' :  
                   d > 40 ? '#6baed6' :  
                   d > 20 ? '#bdd7e7' :  
                            '#eff3ff';   
        }

        // 4. Function to determine circle radius (size) based on rainfall
        function getRadius(d) {
            return d > 80 ? 25 :  
                   d > 60 ? 20 :  
                   d > 40 ? 15 :  
                   d > 20 ? 10 :  
                            5;    
        }

        // NEW: Function to translate exact numbers to legend ranges
        function getRainfallRange(d) {
            return d > 80 ? '81 - 100+ mm' :  
                   d > 60 ? '61 - 80 mm' :  
                   d > 40 ? '41 - 60 mm' :  
                   d > 20 ? '21 - 40 mm' :  
                            '0 - 20 mm';  
        }

        // 5. Add a legend to the map
        var legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend'),
                grades = [0, 21, 41, 61, 81],
                labels = ['0 - 20 mm', '21 - 40 mm', '41 - 60 mm', '61 - 80 mm', '81 - 100+ mm'];

            div.innerHTML = '<strong>Rainfall Amount</strong><br><br>';
            
            for (var i = 0; i < grades.length; i++) {
                var r = getRadius(grades[i]);
                var diameter = r * 2;
                
                div.innerHTML +=
                    '<div class="legend-item">' +
                        '<div class="legend-circle-container">' +
                            '<div class="legend-circle" style="background:' + getColor(grades[i]) + '; width:' + diameter + 'px; height:' + diameter + 'px;"></div>' +
                        '</div>' +
                        '<span>' + labels[i] + '</span>' +
                    '</div>';
            }
            return div;
        };
        legend.addTo(map);

        // 6. Load and parse the CSV data
        Papa.parse("data.csv", {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true, 
            error: function(err) {
                alert("Could not load data.csv. Make sure you are viewing this via your GitHub Pages link, not a local file.");
            },
            complete: function(results) {
                var data = results.data;
                var dateColumns = Object.keys(data[0]).slice(4);
                var dateLayers = {};

                dateColumns.forEach(function(date) {
                    var layerGroup = L.layerGroup();

                    data.forEach(function(row) {
                        if (row.Latitude && row.Longitude) {
                            var rainfall = row[date] || 0; 
                            var currentRadius = getRadius(rainfall);
                            var rangeString = getRainfallRange(rainfall); // Get the text range
                            
                            var marker = L.circleMarker([row.Latitude, row.Longitude], {
                                radius: currentRadius,
                                fillColor: getColor(rainfall),
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8 
                            });

                            // Updated Popup to show the Range String instead of exact numbers
                            marker.bindPopup("<b>" + row['Station Name'] + "</b><br>Date: " + date + "<br>Rainfall: " + rangeString);
                            
                            // The permanent label that stays on the map
                            marker.bindTooltip(row['Station Name'], {
                                permanent: true, 
                                direction: 'right', 
                                className: 'station-label',
                                offset: [currentRadius, 0] 
                            });

                            layerGroup.addLayer(marker);
                        }
                    });

                    dateLayers[date] = layerGroup;
                });

                // Adds the date selector to the top right
                L.control.layers(dateLayers, null, {collapsed: false, position: 'topright'}).addTo(map);

                if (dateColumns.length > 0) {
                    dateLayers[dateColumns[0]].addTo(map);
                }
            }
        });
    </script>
</body>
</html>
